# /etc/modprobe.d/trigger6.conf
# MCT Trigger 6 USB Display driver -- module parameter defaults
#
# Changes take effect on next modprobe or reboot.
# Documentation: modinfo trigger6

# Safe mode: keep DRM connectors disconnected until validated
# options trigger6 manual_only=1

# JPEG quality for secondary head (range: 1-100, default: 40)
# options trigger6 jpeg_quality=40

# Frame pacing (default: 5ms, ignored for raw heads with damage tracking)
# options trigger6 frame_min_interval_ms=5

# Secondary head adaptive pacing cap (default: 250ms, 0=unconstrained)
# options trigger6 secondary_frame_min_interval_ms=250

# USB bus serialization (default: on, disable only for tested xHCI hosts)
# options trigger6 serialize_usb_bus=1
