PACKAGE_NAME="jcd543-trigger6"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="trigger6"
BUILT_MODULE_LOCATION[0]="kernel"
DEST_MODULE_LOCATION[0]="/kernel/drivers/gpu/drm/trigger6"
AUTOINSTALL="yes"
# Build matching headers through Kbuild; never call the repo's manual loader.
# New kernel artifacts are not approved/loaded automatically by the controller.
MAKE[0]="make -C /usr/lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/kernel W=1 CONFIG_DEBUG_INFO_BTF_MODULES= modules"
STRIP[0]="no"
NO_WEAK_MODULES="yes"
